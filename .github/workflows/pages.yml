name: Pages

# The static build, which is now the only build: solo runs entirely in the
# browser and multiplayer goes peer-to-peer, so GitHub Pages hosts the whole
# game. Actions rather than Pages-from-main because _site has to be assembled
# first; the Node server this replaced is deleted, along with the Render deploy
# that ci.yml used to trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these, and only one deploy may be in flight at a time.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Babylon is copied into the output from node_modules, so the CDN stays a
      # fallback rather than becoming a hard dependency.
      - run: npm ci
      # ci.yml used to own this, back when there was a server for it to smoke
      # test as well. There is no server now, so this is the whole gate.
      - run: npm run format:check
      - run: npm test
      - run: npm run build:static
        env:
          # Stamps the menu's "build <sha>" line, which is how a deploy is
          # confirmed once there is no server to ask.
          APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
