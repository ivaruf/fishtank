name: Pages

# The static, serverless build: solo runs entirely in the browser and
# multiplayer goes peer-to-peer, so GitHub Pages can host the whole game.
# Deliberately not wired to main yet; this is the p2p experiment.
on:
  push:
    branches: [p2p_experiment]
  workflow_dispatch:

# Pages needs these, and only one deploy may be in flight at a time.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Babylon is copied into the output from node_modules, so the CDN stays a
      # fallback rather than becoming a hard dependency.
      - run: npm ci
      - run: npm test
      - run: npm run build:static
        env:
          # Stamps the menu's "build <sha>" line, which is how a deploy is
          # confirmed once there is no server to ask.
          APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
