name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The fish models are ~36 MB of the repo; a shallow clone is enough
        # because the tests load them straight off the working tree.
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Test
        # Covers the Babylon model tiers on NullEngine, the world simulation,
        # and the real HTTP/WebSocket surface. No browser or display needed.
        run: npm test

      - name: Smoke-test the server the way a platform would
        run: |
          PORT=3999 npm start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3999/healthz > /dev/null; then break; fi
            sleep 1
          done
          echo "--- /healthz ---"
          curl -sf http://127.0.0.1:3999/healthz | head -c 400
          echo
          # The page must come back compressed, and revalidate to an empty 304.
          etag=$(curl -sf -D - -o /dev/null http://127.0.0.1:3999/ | awk 'tolower($1)=="etag:"{print $2}' | tr -d '\r')
          code=$(curl -sf -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" http://127.0.0.1:3999/)
          test "$code" = "304" || { echo "expected a 304 on revalidation, got $code"; exit 1; }
          echo "revalidation returns $code"
          kill %1

  # Render's own auto-deploy fires on push regardless of whether the tests
  # pass, so render.yaml sets autoDeploy: false and this job is the gate. A
  # deploy restarts the process, which ends every live game, so it should only
  # ever run on a green main.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so nothing was deployed."
            echo "Copy the deploy hook from the Render service (Settings -> Deploy Hook)"
            echo "into GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo
          echo "Deploy requested. Render builds and restarts; live games end."
