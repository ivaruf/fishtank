# Render Blueprint. Create the service from this file (Render dashboard ->
# Blueprints -> New Blueprint Instance) so the config lives with the code
# instead of only in a dashboard. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: fishtank
    runtime: node
    # Frankfurt is Render's EU region, ~25 ms from Oslo.
    region: frankfurt
    # Free is 512 MB / 0.1 CPU. It will NOT sleep mid-game: Render counts
    # WebSocket messages from existing connections as inbound traffic, and
    # players send input constantly. The real risk is CPU, not sleep. Measured
    # on this repo, a full tank needs far more than 0.1 CPU:
    #   24 players 25% of a core, 48 players 36%, and that is on a fast local
    #   core, so a shared Render slice will be worse.
    # Expect the 30 Hz tick and per-client deflate to fall behind under load.
    # `plan: starter` ($7/mo) is 0.5 CPU, comfortably above the measured peak;
    # switching is this one line. If you do upgrade, also add `numInstances: 1`
    # below, because paid plans CAN scale and a second instance would serve a
    # second, separate "Aquarium 001".
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # Reports the live room list, so a wedged tick loop fails the probe rather
    # than passing because the process happens to still be up.
    healthCheckPath: /healthz
    # Deploys are triggered by .github/workflows/ci.yml once the tests pass,
    # not by the raw push. Set this to true (and drop the deploy job) if you
    # would rather have Render deploy every commit unconditionally.
    autoDeploy: false
    envVars:
      # Matches the engines field in package.json.
      - key: NODE_VERSION
        value: "22"
